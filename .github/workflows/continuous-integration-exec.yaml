# Pipeline de Integração Continua para a disciplina 04 - Integração Contínua para Automação de Testes
# Contemplando o projeto Serviço de Pagamento

name: 'CI - Validação do Serviço de Pagamento'

on:
  workflow_dispatch:

  push:
    branches:
      - development

  schedule:
    # Executa a cada 1 hora aos sábados e domingos
    - cron: '0 * * * 6,0'

permissions:
  contents: write

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando dependências
        run: npm install

      # executar os testes automatizados com relatório
      - name: Executando testes automatizados
        run: npm run test:report

      # salvar relatório de testes
      - name: Salvando relatório de testes
        uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          path: ./mochawesome-report
          name: Relatório de Testes Mochawesome
          retention-days: 30

    merge-to-production:
    runs-on: ubuntu-24.04
    needs: [e2e-tests]

    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/development' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurando usuario Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Realizando merge para production
        run: |
          git fetch origin
          git checkout prodution
          git pull origin prodution
          git merge origin/development --no-ff -m "ci: realiza merge automatico para production"
          git push origin production